<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sticker Maker</title>
<meta name="theme-color" content="#20232b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Bangers";src:url(fonts/Bangers.woff2) format("woff2")}
@font-face{font-family:"Lilita One";src:url(fonts/LilitaOne.woff2) format("woff2")}
@font-face{font-family:"Permanent Marker";src:url(fonts/PermanentMarker.woff2) format("woff2")}
@font-face{font-family:"Bungee";src:url(fonts/Bungee.woff2) format("woff2")}
@font-face{font-family:"Luckiest Guy";src:url(fonts/LuckiestGuy.woff2) format("woff2")}
@font-face{font-family:"Caveat";font-weight:700;src:url(fonts/Caveat.woff2) format("woff2")}
:root{--bg:#f2f2f2;--panel:#fff;--line:#d6d6d6;--text:#1c1c1c;--dim:#6b6b6b;--acc:#2a64d6;--bar:#20232b;--bartext:#fff;--danger:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 12px;cursor:pointer}
button:active{background:#e6e6e6}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:active{background:#1f4fae}
button.dan{color:var(--danger)}
button:disabled{opacity:.4}
input[type=text]{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--text);user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--acc)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.top{height:52px;flex:none;background:var(--bar);color:var(--bartext);display:flex;align-items:center;gap:4px;padding:0 6px;padding-top:env(safe-area-inset-top)}
.top h1{font-size:18px;font-weight:600;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;border:0;color:var(--bartext);padding:8px 10px;display:flex;align-items:center;gap:6px}
.top button:active{background:rgba(255,255,255,.12)}
.top button:disabled{opacity:.35}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.empty{padding:40px 24px;text-align:center;color:var(--dim)}
/* home */
.packrow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer}
.packrow:active{background:#ececec}
.packrow .ic{width:58px;height:58px;flex:none;background:#e9e9e9 center/contain no-repeat;border:1px solid var(--line)}
.packrow .nm{font-weight:600;font-size:16px}
.packrow .sub{color:var(--dim);font-size:13px}
.packrow .prev{display:flex;gap:2px;margin-left:auto}
.packrow .prev i{width:30px;height:30px;background:center/contain no-repeat}
.bottombar{flex:none;display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.bottombar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
/* pack */
.packhead{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.packhead .ic{width:72px;height:72px;flex:none;border:1px solid var(--line);background:#e9e9e9 center/contain no-repeat;position:relative;cursor:pointer}
.packhead .ic span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:1px 0}
.packhead .nm{font-weight:600;font-size:17px}
.packhead .sub{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;padding:10px}
.cell{aspect-ratio:1;background:#fff center/86% no-repeat;border:1px solid var(--line);position:relative;cursor:pointer}
.cell:active{border-color:var(--acc)}
.cell.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc);gap:4px;font-size:13px;background:#fafafa;border-style:dashed}
.cell b{position:absolute;left:3px;top:2px;font-size:11px;color:var(--dim);font-weight:500}
.note{padding:0 14px 12px;color:var(--dim);font-size:13px}
/* editor */
#ed{background:#2a2d35}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0}
#stage{touch-action:none;display:block}
.tools{flex:none;display:flex;overflow-x:auto;background:var(--bar);border-top:1px solid #3a3e48;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:1 0 auto;min-width:66px;background:transparent;border:0;border-radius:0;color:#c9ccd4;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:8px 6px}
.tools button.on{color:#fff;background:#3a3f4c;box-shadow:inset 0 -3px 0 var(--acc)}
.opts{flex:none;background:#262931;color:#e8e9ec;padding:8px 12px;min-height:96px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.opts .row{display:flex;align-items:center;gap:10px;margin:4px 0}
.opts .row label{width:84px;flex:none;font-size:13px;color:#b7bac3}
.opts .row output{width:34px;text-align:right;font-size:13px;color:#b7bac3}
.opts button{background:#353945;border-color:#474c59;color:#eceef2;padding:7px 10px;font-size:13.5px}
.opts button:active{background:#454a58}
.opts button.pri{background:var(--acc);border-color:var(--acc)}
.opts .hint{font-size:12.5px;color:#9a9eaa;margin:2px 0 6px}
.opts .btns{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border:2px solid #555b69;flex:none;cursor:pointer;border-radius:2px}
.sw.on{border-color:#fff;outline:2px solid var(--acc)}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.busy{position:absolute;inset:0;background:rgba(20,22,28,.72);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;font-size:14px;text-align:center;padding:20px}
.busy.on{display:flex}
.bar{width:220px;height:6px;background:#444;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
/* dialogs */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.sheet{align-items:flex-end;padding:0}
.dlg{background:var(--panel);color:var(--text);width:100%;max-width:420px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.ov.sheet .dlg{max-width:none;border:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dlg h2{font-size:17px;margin:0;padding:14px 16px 6px}
.dlg .body{padding:6px 16px 12px}
.dlg .body p{margin:6px 0;color:#444}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
.dlg .fld{margin:8px 0}
.dlg .fld span{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid #ececec;border-radius:0;padding:13px 16px;background:#fff}
.mitem small{display:block;color:var(--dim);font-size:12.5px}
.mitem.dan{color:var(--danger)}
.cp{display:flex;flex-direction:column;gap:10px}
.cp canvas{width:100%;touch-action:none;display:block;border:1px solid var(--line)}
.cp .sws .sw{border-color:#ccc}
.fontlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fontlist button{font-size:20px;padding:8px 4px}
.fontlist button.on{border-color:var(--acc);outline:1px solid var(--acc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;font-size:14px;z-index:60;max-width:90vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen on" id="home">
  <div class="top"><h1>Sticker Maker</h1></div>
  <div class="scroll" id="packlist"></div>
  <div class="bottombar"><button id="imppack"><svg class="i"><use href="#i-export"/></svg>Import pack</button><button class="pri" id="newpack"><svg class="i"><use href="#i-plus"/></svg>New pack</button></div>
</div>

<!-- PACK -->
<div class="screen" id="pack">
  <div class="top">
    <button id="pk-back"><svg class="i"><use href="#i-back"/></svg></button>
    <h1 id="pk-title">Pack</h1>
    <button id="pk-more"><svg class="i"><use href="#i-more"/></svg></button>
  </div>
  <div class="scroll">
    <div class="packhead">
      <div class="ic" id="pk-icon"><span>Icon</span></div>
      <div style="min-width:0"><div class="nm" id="pk-name"></div><div class="sub" id="pk-sub"></div></div>
    </div>
    <div class="grid" id="pk-grid"></div>
    <div class="note" id="pk-note"></div>
  </div>
  <div class="bottombar">
    <button id="pk-add"><svg class="i"><use href="#i-plus"/></svg>Add sticker</button>
    <button class="pri" id="pk-export"><svg class="i"><use href="#i-export"/></svg>Export</button>
  </div>
</div>

<!-- EDITOR -->
<div class="screen" id="ed">
  <div class="top">
    <button id="ed-back"><svg class="i"><use href="#i-close"/></svg></button>
    <h1 id="ed-title">Sticker</h1>
    <button id="ed-undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button id="ed-redo"><svg class="i"><use href="#i-redo"/></svg></button>
    <button id="ed-save" style="font-weight:600">Save</button>
  </div>
  <div class="stagewrap" id="stagewrap"><canvas id="stage"></canvas>
    <div class="busy" id="busy"><div id="busy-t">Working...</div><div class="bar"><i id="busy-b"></i></div></div>
  </div>
  <div class="tools" id="tools"></div>
  <div class="opts" id="opts"></div>
</div>

<input type="file" id="file" accept="image/*" hidden><input type="file" id="zfile" accept=".zip,.wastickers,application/zip,application/octet-stream" hidden>

<svg width="0" height="0" style="position:absolute">
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></symbol>
 <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>

 <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
 <symbol id="i-auto" viewBox="0 0 24 24"><path d="M4 20l10-10"/><path d="M14 10l2-2"/><path d="M17 3v3M15.5 4.5h3M20 8v2M19 9h2M10 4v2M9 5h2"/></symbol>
 <symbol id="i-erase" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L11 19H8z"/><path d="M9 11l5 5"/></symbol>
 <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 21c3-1 5-3 6-6"/><path d="M9 15l8.5-8.5a2.1 2.1 0 013 3L12 18z"/><path d="M15 9l3 3"/></symbol>
 <symbol id="i-magic" viewBox="0 0 24 24"><path d="M5 19c0-4 3-4 3-8a4 4 0 018 0c0 4 3 4 3 8z"/><path d="M8 19h8"/></symbol>

 <symbol id="i-outline" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/><path d="M12 7.5l1.4 3 3.2.4-2.4 2.2.6 3.2L12 14.7l-2.8 1.6.6-3.2-2.4-2.2 3.2-.4z" stroke-width="1.2"/></symbol>
 <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
</svg>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
function icon(id){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');s.innerHTML='<use href="#'+id+'"/>';return s}
function mk(w,hh){const c=document.createElement('canvas');c.width=w;c.height=hh;return c}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function toBlob(c,type='image/png',q){return new Promise(r=>c.toBlob(r,type,q))}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function blobImg(b){const u=URL.createObjectURL(b);try{return await loadImg(u)}finally{setTimeout(()=>URL.revokeObjectURL(u),2000)}}
function toast(t){let e=$('.toast');if(!e){e=h('div',{class:'toast'});document.body.append(e)}e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
const urlCache=new Map();
function burl(key,blob){if(!blob)return '';let u=urlCache.get(key);if(u&&u.b===blob)return u.u;if(u)URL.revokeObjectURL(u.u);u={b:blob,u:URL.createObjectURL(blob)};urlCache.set(key,u);return u.u}

/* ---------- own dialogs (no browser pop-ups) ---------- */
function openOv(sheet){const ov=h('div',{class:'ov'+(sheet?' sheet':'')});document.body.append(ov);return ov}
function dialog({title,body,buttons,sheet}){return new Promise(res=>{const ov=openOv(sheet);const d=h('div',{class:'dlg'});if(title)d.append(h('h2',null,title));const b=h('div',{class:'body'});if(typeof body==='string')b.append(h('p',null,body));else if(body)b.append(body);d.append(b);const acts=h('div',{class:'acts'});const close=v=>{ov.remove();res(v)};for(const bt of buttons||[{label:'OK',value:true,pri:true}])acts.append(h('button',{class:bt.pri?'pri':bt.dan?'dan':'',onclick:()=>close(typeof bt.value==='function'?bt.value():bt.value)},bt.label));d.append(acts);ov.append(d);ov.addEventListener('pointerdown',e=>{if(e.target===ov)close(null)});const f=d.querySelector('input');if(f)setTimeout(()=>{f.focus();f.select&&f.select()},50)})}
function bxAlert(t,title){return dialog({title,body:t,buttons:[{label:'OK',value:true,pri:true}]})}
function bxConfirm(t,yes='Delete',title){return dialog({title,body:t,buttons:[{label:'Cancel',value:false},{label:yes,value:true,dan:yes==='Delete',pri:yes!=='Delete'}]})}
function bxForm(title,fields,ok='OK'){const wrap=h('div');const ins=fields.map(f=>{const i=h('input',{type:'text',value:f.value||'',maxlength:f.max||60,placeholder:f.ph||''});wrap.append(h('label',{class:'fld'},h('span',null,f.label),i));return i});
  return dialog({title,body:wrap,buttons:[{label:'Cancel',value:null},{label:ok,pri:true,value:()=>ins.map(i=>i.value.trim())}]})}
function menu(title,items){return new Promise(res=>{const ov=openOv(true);const d=h('div',{class:'dlg'});if(title)d.append(h('h2',{style:'padding-bottom:10px'},title));const close=v=>{ov.remove();res(v)};for(const it of items){if(!it)continue;d.append(h('button',{class:'mitem'+(it.dan?' dan':''),onclick:()=>close(it.value)},h('div',null,it.label,it.sub?h('small',null,it.sub):null)))}d.append(h('button',{class:'mitem',style:'color:var(--dim)',onclick:()=>close(null)},'Cancel'));ov.append(d);ov.addEventListener('pointerdown',e=>{if(e.target===ov)close(null)})})}

/* own color picker */
const SWATCHES=['#ffffff','#000000','#7a7a7a','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#32ade6','#007aff','#5856d6','#af52de','#ff2d55','#a2845e','#ffd6e0','#c8f7c5'];
function hex2rgb(x){x=x.replace('#','');if(x.length===3)x=[...x].map(c=>c+c).join('');const n=parseInt(x,16);return[n>>16&255,n>>8&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0;if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360}return[hh,mx?d/mx:0,mx]}
function hsv2rgb(hh,s,v){const c=v*s,x=c*(1-Math.abs((hh/60)%2-1)),m=v-c;let r,g,b;[r,g,b]=hh<60?[c,x,0]:hh<120?[x,c,0]:hh<180?[0,c,x]:hh<240?[0,x,c]:hh<300?[x,0,c]:[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255]}
function pickColor(cur){let [H,S,V]=rgb2hsv(...hex2rgb(cur));const wrap=h('div',{class:'cp'});const sv=mk(600,300),hue=mk(600,40);const prev=h('div',{style:'height:34px;border:1px solid #ccc'});
  const sws=h('div',{class:'sws'});SWATCHES.forEach(c=>sws.append(h('div',{class:'sw',style:'background:'+c,onclick:()=>{[H,S,V]=rgb2hsv(...hex2rgb(c));draw()}})));
  const hexIn=h('input',{type:'text',maxlength:7});hexIn.addEventListener('change',()=>{if(/^#?[0-9a-f]{6}$/i.test(hexIn.value.trim())){[H,S,V]=rgb2hsv(...hex2rgb(hexIn.value.trim()));draw()}});
  wrap.append(sws,sv,hue,h('div',{style:'display:flex;gap:8px;align-items:center'},prev,hexIn));prev.style.flex='1';hexIn.style.width='110px';
  function draw(){const c=sv.getContext('2d');const [r,g,b]=hsv2rgb(H,1,1);let gr=c.createLinearGradient(0,0,600,0);gr.addColorStop(0,'#fff');gr.addColorStop(1,rgb2hex(r,g,b));c.fillStyle=gr;c.fillRect(0,0,600,300);gr=c.createLinearGradient(0,0,0,300);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'#000');c.fillStyle=gr;c.fillRect(0,0,600,300);c.lineWidth=4;c.strokeStyle=V>.5?'#000':'#fff';c.beginPath();c.arc(S*600,(1-V)*300,12,0,7);c.stroke();
    const hc=hue.getContext('2d');gr=hc.createLinearGradient(0,0,600,0);for(let i=0;i<=6;i++)gr.addColorStop(i/6,rgb2hex(...hsv2rgb(i*60%360,1,1)));hc.fillStyle=gr;hc.fillRect(0,0,600,40);hc.fillStyle='#fff';hc.strokeStyle='#000';hc.lineWidth=2;hc.fillRect(H/360*600-4,0,8,40);hc.strokeRect(H/360*600-4,1,8,38);
    const hx=rgb2hex(...hsv2rgb(H,S,V));prev.style.background=hx;hexIn.value=hx}
  function drag(cv,fn){cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);fn(e);const mv=ev=>fn(ev),up=()=>{cv.removeEventListener('pointermove',mv);cv.removeEventListener('pointerup',up)};cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',up)})}
  drag(sv,e=>{const r=sv.getBoundingClientRect();S=clamp((e.clientX-r.left)/r.width,0,1);V=clamp(1-(e.clientY-r.top)/r.height,0,1);draw()});
  drag(hue,e=>{const r=hue.getBoundingClientRect();H=clamp((e.clientX-r.left)/r.width,0,.9999)*360;draw()});
  draw();return dialog({title:'Color',body:wrap,buttons:[{label:'Cancel',value:null},{label:'Use',pri:true,value:()=>rgb2hex(...hsv2rgb(H,S,V))}]})}

/* ---------- storage (IndexedDB) ---------- */
let DB;
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('sticker-maker',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('packs',{keyPath:'id'});const s=d.createObjectStore('stickers',{keyPath:'id'});s.createIndex('pack','packId')};r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const dbPut=(st,v)=>tx(st,'readwrite',s=>{s.put(v)});
const dbDel=(st,k)=>tx(st,'readwrite',s=>{s.delete(k)});
const dbGet=(st,k)=>tx(st,'readonly',s=>s.get(k));
const dbAll=st=>tx(st,'readonly',s=>s.getAll());
const packStickers=pid=>tx('stickers','readonly',s=>s.index('pack').getAll(pid)).then(a=>a.sort((x,y)=>x.order-y.order));

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='ed')requestAnimationFrame(layoutStage)}

async function renderHome(){const list=$('#packlist');list.innerHTML='';const packs=(await dbAll('packs')).sort((a,b)=>b.created-a.created);
  if(!packs.length){list.append(h('div',{class:'empty'},h('div',{style:'font-size:17px;color:#333;margin-bottom:6px'},'No sticker packs yet'),'Tap New pack, then add pictures to it.'));return}
  for(const p of packs){const st=await packStickers(p.id);const ic=p.icon||(st[0]&&st[0].png);
    const prev=h('div',{class:'prev'});st.slice(0,3).forEach(s=>prev.append(h('i',{style:`background-image:url(${burl(s.id,s.png)})`})));
    list.append(h('div',{class:'packrow',onclick:()=>openPack(p.id)},h('div',{class:'ic',style:ic?`background-image:url(${burl('icon'+p.id,ic)})`:''}),h('div',{style:'min-width:0'},h('div',{class:'nm'},p.name),h('div',{class:'sub'},st.length+' sticker'+(st.length===1?'':'s')+(p.author?' · '+p.author:''))),prev))}}

$('#newpack').onclick=async()=>{const r=await bxForm('New sticker pack',[{label:'Pack name',ph:'My stickers',max:128},{label:'Author (shown in WhatsApp)',ph:'Your name',max:128}],'Create');if(!r)return;const p={id:uid(),name:r[0]||'My stickers',author:r[1]||'',icon:null,created:Date.now()};await dbPut('packs',p);openPack(p.id)};

let PK=null;
async function openPack(id){PK=await dbGet('packs',id);if(!PK){show('home');return renderHome()}show('pack');await renderPack()}
async function renderPack(){const st=await packStickers(PK.id);$('#pk-title').textContent=PK.name;$('#pk-name').textContent=PK.name;$('#pk-sub').textContent=st.length+' sticker'+(st.length===1?'':'s')+(PK.author?' · by '+PK.author:'');
  const ic=PK.icon||(st[0]&&st[0].png);$('#pk-icon').style.backgroundImage=ic?`url(${burl('icon'+PK.id,ic)})`:'';
  const g=$('#pk-grid');g.innerHTML='';st.forEach((s,i)=>g.append(h('div',{class:'cell',style:`background-image:url(${burl(s.id,s.png)})`,onclick:()=>stickerMenu(s,st)},h('b',null,i+1))));
  g.append(h('div',{class:'cell add',onclick:addSticker},icon('i-plus'),'Add'));
  $('#pk-note').textContent=st.length<3?'WhatsApp needs at least 3 stickers in a pack.':st.length>30?'WhatsApp packs hold up to 30 stickers. Export will split this pack into parts.':''}
$('#pk-back').onclick=()=>{show('home');renderHome()};
$('#pk-add').onclick=()=>addSticker();
$('#pk-icon').onclick=async()=>{const st=await packStickers(PK.id);const v=await menu('Pack icon',[{label:'Pick one of the stickers',value:'pick'},{label:'Import a picture',sub:'Cut it out like a sticker',value:'imp'},PK.icon&&{label:'Edit icon',value:'edit'},PK.icon&&{label:'Use the first sticker (default)',value:'clear'}]);
  if(v==='pick'){if(!st.length)return bxAlert('Add a sticker first.');const s=await pickSticker(st);if(s){PK.icon=s.png;PK.iconProj=s.proj;await dbPut('packs',PK);renderPack()}}
  else if(v==='imp'){const f=await chooseFile();if(f)openEditor({mode:'icon',file:f})}
  else if(v==='edit'){openEditor(PK.iconProj?{mode:'icon',proj:PK.iconProj}:{mode:'icon',file:PK.icon})}
  else if(v==='clear'){PK.icon=null;PK.iconProj=null;await dbPut('packs',PK);renderPack()}};
function pickSticker(st){return new Promise(res=>{const ov=openOv(true);const d=h('div',{class:'dlg'},h('h2',{style:'padding-bottom:6px'},'Pick a sticker'));const g=h('div',{class:'grid'});const close=v=>{ov.remove();res(v)};st.forEach(s=>g.append(h('div',{class:'cell',style:`background-image:url(${burl(s.id,s.png)})`,onclick:()=>close(s)})));d.append(g,h('button',{class:'mitem',style:'color:var(--dim)',onclick:()=>close(null)},'Cancel'));ov.append(d);ov.addEventListener('pointerdown',e=>{if(e.target===ov)close(null)})})}
$('#pk-more').onclick=async()=>{const v=await menu(PK.name,[{label:'Rename pack',value:'ren'},{label:'Delete pack',value:'del',dan:true}]);
  if(v==='ren'){const r=await bxForm('Rename pack',[{label:'Pack name',value:PK.name,max:128},{label:'Author',value:PK.author,max:128}],'Save');if(r){PK.name=r[0]||PK.name;PK.author=r[1];await dbPut('packs',PK);renderPack()}}
  if(v==='del'){if(await bxConfirm('Delete "'+PK.name+'" and all its stickers?')){const st=await packStickers(PK.id);for(const s of st)await dbDel('stickers',s.id);await dbDel('packs',PK.id);show('home');renderHome()}}};
async function stickerMenu(s,st){const i=st.indexOf(s);const v=await menu('Sticker '+(i+1),[{label:'Edit',value:'edit'},{label:'Send',sub:'Share it straight to a chat app',value:'send'},{label:'Save picture to phone',value:'save'},{label:'Use as pack icon',value:'icon'},{label:'Make a copy',value:'dup'},i>0&&{label:'Move earlier',value:'up'},i<st.length-1&&{label:'Move later',value:'down'},{label:'Delete',value:'del',dan:true}]);
  if(v==='edit')openEditor({mode:'sticker',sticker:s});
  if(v==='send'){const wb=await webpUnder(await blobImg(s.png),512,100*1024);shareOrSave(new File([wb],'sticker.webp',{type:'image/webp'}))}
  if(v==='save')saveFile(s.png,safeName(PK.name)+'-'+(i+1)+'.png');
  if(v==='icon'){PK.icon=s.png;PK.iconProj=s.proj;await dbPut('packs',PK);renderPack();toast('Pack icon set')}
  if(v==='dup'){const c={...s,id:uid(),order:s.order+0.5};await dbPut('stickers',c);await reorder();renderPack()}
  if(v==='up'||v==='down'){const j=v==='up'?i-1:i+1;const o=st[j].order;st[j].order=s.order;s.order=o;await dbPut('stickers',st[j]);await dbPut('stickers',s);renderPack()}
  if(v==='del'&&await bxConfirm('Delete this sticker?')){await dbDel('stickers',s.id);renderPack()}}
async function reorder(){const st=await packStickers(PK.id);for(let i=0;i<st.length;i++){if(st[i].order!==i){st[i].order=i;await dbPut('stickers',st[i])}}}
function chooseFile(){return new Promise(res=>{const f=$('#file');f.value='';f.onchange=()=>res(f.files[0]||null);f.click()})}
async function addSticker(){const f=await chooseFile();if(f)openEditor({mode:'sticker',file:f})}

/* ---------- editor ---------- */
const E={tool:'move',t:{x:256,y:256,s:1,r:0,fx:1},ow:0,oc:'#ffffff',texts:[],sel:-1,brush:28,soft:20,tol:24,undo:[],redo:[],view:{z:1,x:0,y:0}};
const stage=$('#stage'),sctx=stage.getContext('2d');
const LAY=mk(512,512),OUT=mk(512,512);
let S=300,DPR=1,dirty=true,cursor=null,lasso=null;
const FONTS=['Lilita One','Bangers','Luckiest Guy','Bungee','Permanent Marker','Caveat','Arial Black','Georgia'];

async function openEditor(o){E.mode=o.mode;E.sticker=o.sticker||null;E.undo=[];E.redo=[];E.view={z:1,x:0,y:0};E.sel=-1;
  $('#ed-title').textContent=o.mode==='icon'?'Pack icon':o.sticker?'Edit sticker':'New sticker';
  const proj=o.proj||(o.sticker&&o.sticker.proj);if(!proj&&!o.file&&o.sticker)o.file=o.sticker.png;
  if(proj){const si=await blobImg(proj.src),mi=await blobImg(proj.mask);E.src=mk(si.width,si.height);E.src.getContext('2d').drawImage(si,0,0);E.mask=mk(si.width,si.height);E.mask.getContext('2d').drawImage(mi,0,0);E.t={...proj.t};E.ow=proj.ow;E.oc=proj.oc;E.texts=(proj.texts||[]).map(t=>({...t}))}
  else{let img;try{img=await blobImg(o.file)}catch(e){return bxAlert('That picture could not be opened.')}const k=Math.min(1,1400/Math.max(img.width,img.height));const w=Math.round(img.width*k),hh=Math.round(img.height*k);E.src=mk(w,hh);E.src.getContext('2d').drawImage(img,0,0,w,hh);E.mask=mk(w,hh);const m=E.mask.getContext('2d');m.fillStyle='#fff';m.fillRect(0,0,w,hh);E.texts=[];E.ow=0;E.oc='#ffffff';fitImage();if(o.sticker||o.mode==='icon'&&o.file===PK.icon)E.t.s=512/Math.max(w,hh)}
  E.srcData=E.src.getContext('2d').getImageData(0,0,E.src.width,E.src.height);
  E.cut=mk(E.src.width,E.src.height);updateCut();setTool('move');show('ed');dirty=true;updUndo()}
function fitImage(){const w=E.src.width,hh=E.src.height;const room=512-2*(16+E.ow);E.t={x:256,y:256,s:room/Math.max(w,hh),r:0,fx:1}}
function updateCut(){const c=E.cut.getContext('2d');c.globalCompositeOperation='copy';c.drawImage(E.src,0,0);c.globalCompositeOperation='destination-in';c.drawImage(E.mask,0,0);c.globalCompositeOperation='source-over';dirty=true}

function snap(){const m=mk(E.mask.width,E.mask.height);m.getContext('2d').drawImage(E.mask,0,0);return{mask:m,t:{...E.t},ow:E.ow,oc:E.oc,texts:E.texts.map(t=>({...t}))}}
function pushUndo(){E.undo.push(snap());if(E.undo.length>30)E.undo.shift();E.redo=[];updUndo()}
function applySnap(s){const m=E.mask.getContext('2d');m.globalCompositeOperation='copy';m.drawImage(s.mask,0,0);m.globalCompositeOperation='source-over';E.t={...s.t};E.ow=s.ow;E.oc=s.oc;E.texts=s.texts.map(t=>({...t}));if(E.sel>=E.texts.length)E.sel=-1;updateCut();renderOpts()}
function updUndo(){$('#ed-undo').disabled=!E.undo.length;$('#ed-redo').disabled=!E.redo.length}
$('#ed-undo').onclick=()=>{if(!E.undo.length)return;E.redo.push(snap());applySnap(E.undo.pop());updUndo()};
$('#ed-redo').onclick=()=>{if(!E.redo.length)return;E.undo.push(snap());applySnap(E.redo.pop());updUndo()};

/* outline via exact distance transform */
const INF=1e20;
function edt1d(f,n,d,v,z){let k=0;v[0]=0;z[0]=-INF;z[1]=INF;for(let q=1;q<n;q++){let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k])}k++;v[k]=q;z[k]=s;z[k+1]=INF}k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const dq=q-v[k];d[q]=dq*dq+f[v[k]]}}
function outlineOf(src,r,color){const w=src.width,hh=src.height;const a=src.getContext('2d').getImageData(0,0,w,hh).data;const N=Math.max(w,hh);const f=new Float64Array(w*hh),col=new Float64Array(N),dd=new Float64Array(N),v=new Int32Array(N),z=new Float64Array(N+1);
  for(let i=0;i<w*hh;i++)f[i]=a[i*4+3]>=110?0:INF;
  for(let x=0;x<w;x++){for(let y=0;y<hh;y++)col[y]=f[y*w+x];edt1d(col,hh,dd,v,z);for(let y=0;y<hh;y++)f[y*w+x]=dd[y]}
  for(let y=0;y<hh;y++){const o=y*w;for(let x=0;x<w;x++)col[x]=f[o+x];edt1d(col,w,dd,v,z);for(let x=0;x<w;x++)f[o+x]=dd[x]}
  const out=mk(w,hh),oc=out.getContext('2d'),id=oc.createImageData(w,hh),p=id.data;const [R,G,B]=hex2rgb(color);
  for(let i=0;i<w*hh;i++){const dist=Math.sqrt(f[i]);let al=clamp(r+.5-dist,0,1);if(dist===0)al=1;const j=i*4;p[j]=R;p[j+1]=G;p[j+2]=B;p[j+3]=al*255}
  oc.putImageData(id,0,0);return out}

function drawText(c,t){c.save();c.translate(t.x,t.y);c.rotate(t.r||0);c.font=`${t.font==='Caveat'?'700 ':''}${t.size}px "${t.font}"`;c.textAlign='center';c.textBaseline='middle';const lines=t.text.split('\n');const lh=t.size*1.05;const y0=-(lines.length-1)*lh/2;
  if(t.sw>0){c.lineJoin='round';c.miterLimit=2;c.strokeStyle=t.stroke;c.lineWidth=t.sw*2;lines.forEach((l,i)=>c.strokeText(l,0,y0+i*lh))}
  c.fillStyle=t.fill;lines.forEach((l,i)=>c.fillText(l,0,y0+i*lh));c.restore()}
function textBox(t){const c=LAY.getContext('2d');c.font=`${t.font==='Caveat'?'700 ':''}${t.size}px "${t.font}"`;const lines=t.text.split('\n');const w=Math.max(...lines.map(l=>c.measureText(l).width))+t.sw*2;const hh=lines.length*t.size*1.05+t.sw*2;return{w,h:hh}}
function compose(){const c=LAY.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,512,512);c.save();c.translate(E.t.x,E.t.y);c.rotate(E.t.r);c.scale(E.t.s*E.t.fx,E.t.s);c.imageSmoothingQuality='high';c.drawImage(E.cut,-E.src.width/2,-E.src.height/2);c.restore();
  for(const t of E.texts)drawText(c,t);
  const o=OUT.getContext('2d');o.clearRect(0,0,512,512);if(E.ow>0)o.drawImage(outlineOf(LAY,E.ow,E.oc),0,0);o.drawImage(LAY,0,0)}

let checker;
function layoutStage(){const wr=$('#stagewrap').getBoundingClientRect();S=Math.floor(Math.min(wr.width-16,wr.height-16));S=Math.max(S,120);DPR=window.devicePixelRatio||1;stage.style.width=S+'px';stage.style.height=S+'px';stage.width=Math.round(S*DPR);stage.height=Math.round(S*DPR);checker=null;dirty=true}
addEventListener('resize',()=>{if($('#ed').classList.contains('on'))layoutStage()});
function getChecker(){if(checker)return checker;const c=mk(16,16),x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,16,16);x.fillStyle='#e3e3e3';x.fillRect(0,0,8,8);x.fillRect(8,8,8,8);checker=sctx.createPattern(c,'repeat');return checker}
function frame(){if(dirty&&$('#ed').classList.contains('on')&&E.src){dirty=false;compose();const c=sctx;c.setTransform(1,0,0,1,0,0);c.fillStyle='#2a2d35';c.fillRect(0,0,stage.width,stage.height);
    const k=S*DPR/512*E.view.z;c.setTransform(k,0,0,k,E.view.x*DPR,E.view.y*DPR);c.fillStyle=getChecker();c.fillRect(0,0,512,512);c.imageSmoothingQuality='high';c.drawImage(OUT,0,0);
    if(E.tool==='text'&&E.sel>=0&&E.texts[E.sel]){const t=E.texts[E.sel],b=textBox(t);c.save();c.translate(t.x,t.y);c.rotate(t.r||0);c.lineWidth=1.5/k*DPR;c.setLineDash([5/k*DPR,4/k*DPR]);c.strokeStyle='#2a64d6';c.strokeRect(-b.w/2-6,-b.h/2-6,b.w+12,b.h+12);c.restore()}
    if(cursor&&(E.tool==='erase'||E.tool==='restore')){c.lineWidth=1.5/k*DPR;c.strokeStyle='#fff';c.beginPath();c.arc(cursor.x,cursor.y,E.brush,0,7);c.stroke();c.strokeStyle='#000';c.setLineDash([4/k*DPR,4/k*DPR]);c.stroke();c.setLineDash([])}
    if(lasso&&lasso.length>1){c.lineWidth=2/k*DPR;c.strokeStyle='#fff';c.beginPath();lasso.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();c.setLineDash([6/k*DPR,6/k*DPR]);c.strokeStyle='#2a64d6';c.stroke();c.setLineDash([])}
    c.setLineDash([]);c.lineWidth=1/k*DPR;c.strokeStyle='rgba(255,255,255,.35)';c.strokeRect(0,0,512,512)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* coordinates */
function toArt(cx,cy){const r=stage.getBoundingClientRect();const sx=cx-r.left,sy=cy-r.top;return{x:(sx-E.view.x)/E.view.z*512/S,y:(sy-E.view.y)/E.view.z*512/S}}
function toSrc(p){const t=E.t;let x=p.x-t.x,y=p.y-t.y;const c=Math.cos(-t.r),s=Math.sin(-t.r);const rx=x*c-y*s,ry=x*s+y*c;return{x:rx/(t.s*t.fx)+E.src.width/2,y:ry/t.s+E.src.height/2}}

/* pointer handling */
const ptrs=new Map();let gest=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){if(gest&&gest.kind==='stroke'&&gest.pushed){applySnap(E.undo.pop());updUndo()}lasso=null;startTwo();return}
  if(ptrs.size>2)return;const p=toArt(e.clientX,e.clientY);startOne(p)});
stage.addEventListener('pointermove',e=>{const pp=ptrs.get(e.pointerId);const p=toArt(e.clientX,e.clientY);if(e.pointerType==='mouse'&&(E.tool==='erase'||E.tool==='restore')){cursor=p;dirty=true}if(!pp)return;pp.x=e.clientX;pp.y=e.clientY;if(!gest)return;if(gest.kind==='two')moveTwo();else moveOne(p)});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(gest&&gest.kind!=='two')endOne();if(ptrs.size===0){gest=null;if(E.tool!=='erase'&&E.tool!=='restore'||true){}if(document.querySelector('#ed.on')&&!matchMedia('(pointer:fine)').matches){cursor=null}dirty=true}else if(gest&&gest.kind==='two'&&ptrs.size===1){gest=null}}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const z0=E.view.z,z=clamp(z0*Math.exp(-e.deltaY*.0015),1,8);E.view.x=mx-(mx-E.view.x)*z/z0;E.view.y=my-(my-E.view.y)*z/z0;E.view.z=z;clampView();dirty=true},{passive:false});
function clampView(){const v=E.view;if(v.z<=1.0001){v.z=1;v.x=0;v.y=0;return}v.x=clamp(v.x,S-S*v.z,0);v.y=clamp(v.y,S-S*v.z,0)}

function startOne(p){const T=E.tool;
  if(T==='move'){pushUndo();gest={kind:'move',p0:p,t0:{...E.t}}}
  else if(T==='erase'||T==='restore'){pushUndo();gest={kind:'stroke',pushed:true,last:p};cursor=p;paint(p,p)}
  else if(T==='magic'){gest={kind:'tap'};magicAt(p)}
  else if(T==='lasso'){lasso=[p];gest={kind:'lasso'}}
  else if(T==='text'){let hit=-1;for(let i=E.texts.length-1;i>=0;i--){const t=E.texts[i],b=textBox(t);let x=p.x-t.x,y=p.y-t.y;const c=Math.cos(-(t.r||0)),s=Math.sin(-(t.r||0));const rx=x*c-y*s,ry=x*s+y*c;if(Math.abs(rx)<b.w/2+14&&Math.abs(ry)<b.h/2+14){hit=i;break}}
    E.sel=hit;renderOpts();dirty=true;if(hit>=0){pushUndo();const t=E.texts[hit];gest={kind:'textmove',p0:p,x0:t.x,y0:t.y}}else gest={kind:'none'}}
  else gest={kind:'none'}}
function moveOne(p){const g=gest;
  if(g.kind==='move'){E.t.x=g.t0.x+p.x-g.p0.x;E.t.y=g.t0.y+p.y-g.p0.y;dirty=true}
  else if(g.kind==='stroke'){paint(g.last,p);g.last=p;cursor=p}
  else if(g.kind==='lasso'){const l=lasso[lasso.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>2)lasso.push(p);dirty=true}
  else if(g.kind==='textmove'){const t=E.texts[E.sel];t.x=g.x0+p.x-g.p0.x;t.y=g.y0+p.y-g.p0.y;dirty=true}}
function endOne(){const g=gest;if(!g)return;if(g.kind==='lasso'){if(lasso&&lasso.length>5){pushUndo();applyLasso(lasso)}lasso=null;dirty=true}
  if(g.kind==='stroke'&&matchMedia('(pointer:coarse)').matches)cursor=null;gest=null}
function two(){const a=[...ptrs.values()];const r=stage.getBoundingClientRect();const p1={x:a[0].x-r.left,y:a[0].y-r.top},p2={x:a[1].x-r.left,y:a[1].y-r.top};return{mx:(p1.x+p2.x)/2,my:(p1.y+p2.y)/2,d:Math.hypot(p2.x-p1.x,p2.y-p1.y)||1,a:Math.atan2(p2.y-p1.y,p2.x-p1.x)}}
function startTwo(){const g=two();const T=E.tool;

  }catch(e){console.error(e);busy.remove();bxAlert('Export failed: '+e.message)}};


/* ---------- import a pack (.wastickers / .zip of pictures) ---------- */
async function readZip(blob){const buf=new Uint8Array(await blob.arrayBuffer());const dv=new DataView(buf.buffer);let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}if(e<0)throw new Error('Not a zip file');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const dec=new TextDecoder();const out=[];
  for(let k=0;k<n;k++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const name=dec.decode(buf.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);const raw=buf.subarray(ds,ds+csize);let data;
    if(method===0)data=raw;else if(method===8){data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else continue;
    if(!name.endsWith('/'))out.push({name,data})}return out}
$('#imppack').onclick=()=>{const f=$('#zfile');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;try{await importPack(file)}catch(e){console.error(e);bxAlert('That file could not be read as a sticker pack.')}};f.click()};
async function importPack(file){const ents=await readZip(file);const txt=n=>{const e=ents.find(x=>x.name.split('/').pop().toLowerCase()===n);return e?new TextDecoder().decode(e.data).trim():''};
  const isImg=n=>/\.(png|webp|jpe?g|gif)$/i.test(n);const typ=n=>/\.webp$/i.test(n)?'image/webp':/\.jpe?g$/i.test(n)?'image/jpeg':/\.gif$/i.test(n)?'image/gif':'image/png';
  let pics=ents.filter(e=>isImg(e.name)&&!/(^|\/)(tray|icon)\.(png|webp)$/i.test(e.name));const hasPng=pics.some(e=>/\.png$/i.test(e.name));if(hasPng&&pics.some(e=>/\.webp$/i.test(e.name)))pics=pics.filter(e=>/\.png$/i.test(e.name));
  pics.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!pics.length)throw new Error('no pictures');
  const iconE=ents.find(e=>/(^|\/)icon\.(png|webp)$/i.test(e.name))||ents.find(e=>/(^|\/)tray\.(png|webp)$/i.test(e.name));
  const name=txt('title.txt')||file.name.replace(/\.(zip|wastickers)$/i,'').replace(/-(stickers|telegram|discord)$/,'');
  const p={id:uid(),name,author:txt('author.txt'),icon:null,created:Date.now()};
  const to512=async b=>{const im=await blobImg(b);return toBlob(await sizedCanvas(im,512,512))};
  if(iconE)p.icon=await to512(new Blob([iconE.data],{type:typ(iconE.name)}));await dbPut('packs',p);
  for(let i=0;i<pics.length;i++){await dbPut('stickers',{id:uid(),packId:p.id,order:i,png:await to512(new Blob([pics[i].data],{type:typ(pics[i].name)})),proj:null})}
  toast('Imported '+pics.length+' stickers');openPack(p.id)}

window.__E=E;
